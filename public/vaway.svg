<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="vawayGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="vawayAccent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0284c7" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <!-- Rounded Base Background -->
  <rect x="8" y="8" width="104" height="104" rx="26" fill="url(#vawayGrad)" filter="url(#glow)"/>
  
  <!-- Stylized Mail Flap / V Monogram -->
  <path d="M 28 36 L 60 64 L 92 36" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Bold V Body -->
  <path d="M 36 42 L 60 88 L 84 42" fill="none" stroke="url(#vawayAccent)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Central Spark / Signal -->
  <circle cx="60" cy="52" r="3.5" fill="#ffffff" />
</svg>
